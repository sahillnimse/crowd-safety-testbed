# ground_truth entries (used by scripts/compare_models.py) should be a list
# of {start_sec, end_sec} windows marking when the target event actually
# occurs in the video, e.g.:
#   ground_truth:
#     - {start_sec: 42.0, end_sec: 47.5}
#     - {start_sec: 118.0, end_sec: 121.0}
videos:
  - url: "https://youtu.be/chzr4s3rWCM?si=5jNH0qtQip4nGosd"
    category: fall_and_crowd_crush_test
    models:
      # Fall detection (7)
      - fall_yolo_pose
      - fall_mediapipe_pose
      - fall_stgcn
      - fall_movenet
      - fall_optical_flow
      - fall_posec3d
      - fall_alphapose_lstm
      # Crowd-crush (1)
      - optical_flow_crush
