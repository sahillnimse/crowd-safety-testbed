# crowd_flow.yaml — configuration for the dense optical flow crowd-safety module.
#
# Load with:
#   import yaml
#   with open("configs/crowd_flow.yaml") as f:
#       cfg = yaml.safe_load(f)["crowd_flow"]
#
# Pass the cfg dict to DenseFlowAnalyser(config=cfg, camera_id="ram_kund_approach").
#
# Per-camera calibration
# ----------------------
# Run scripts/calibrate_ground_plane.py on a still frame to generate the
# homography block.  Without it, speed values are in px/frame and speed-based
# alert thresholds (speed_low_ms, speed_high_ms) are DISABLED.  All other
# metrics (divergence, curl, counterflow, turbulence) remain active.
#
# Zone polygons
# -------------
# Polygons are in image (pixel) coordinates.  Use the calibration helper's
# output to verify they cover the right physical areas.  A quick check:
# open a still frame in an image viewer that shows pixel coordinates (e.g.
# GIMP → View → Show Pointer Coordinates) and click the corners of each zone.

crowd_flow:

  # ── Flow computation ────────────────────────────────────────────────────────
  flow_backend:   "dis"      # "dis" | "farneback"
                             # DIS is faster and more robust to CCTV compression
                             # artifacts.  Farneback as a labelled fallback.
  dis_preset:     "medium"   # "ultrafast" | "fast" | "medium"
                             # medium ≈ 4-8 ms on 320×180 at CPU; upgrade if
                             # flow quality on oblique ghat cameras looks noisy.

  # Measured with scripts/validate_flow_routes.py --routes a --sweep on
  # test_videos/Foregin Traffic.mp4 (1280x720 traffic camera), mean endpoint
  # error against known synthetic warps:
  #
  #     target_px=640, DIS medium   0.193 px    127 ms/frame
  #     target_px=480, DIS medium   0.228 px    105 ms/frame   <- default
  #     target_px=320, DIS medium   0.326 px     92 ms/frame
  #     target_px=320, Farneback    0.406 px
  #     target_px=320, DIS fast     0.475 px
  #
  # 480 buys 30% lower error for 13% more time; 640 buys 41% for 37% more.
  # Raise it if motion boundaries around vehicles look soft — the field is
  # upsampled back to source, so a low compute resolution shows up as blurred
  # edges around moving objects rather than as missing motion.  Re-run the
  # sweep after changing footage: the ranking is source-dependent.
  downsample_target_px: 480  # Longest side for flow computation.  Smaller =
                             # faster but coarser; 320 is the recommended start.
                             # The result is scaled back to source resolution.

  # ── Far-field refinement ────────────────────────────────────────────────────
  # A single compute resolution assumes the scene has a single scale, and
  # perspective guarantees it does not.  At downsample_target_px = 480 a
  # pedestrian near the camera spans a few hundred source pixels and one at the
  # back of the same crowd spans a dozen — two or three at compute resolution,
  # smaller than the patch DIS matches on.  The far field then returns motion
  # interpolated from its surroundings instead of measured from the people
  # who are actually there, which is why distant crowds and the far
  # carriageway of a road read as static.
  #
  # This runs a second flow pass over the far field alone, at higher
  # resolution, and feathers it into the base field.  Raising
  # downsample_target_px for the whole frame achieves the same thing at
  # quadratic cost, nearly all of it spent on the near field that was already
  # resolved well enough.
  far_field_refinement: true
  far_field_roi:      [0.0, 0.0, 1.0, 0.45]
                             # Normalised [x1, y1, x2, y2].  Default is the top
                             # 45% of the frame, which is where the horizon sits
                             # on a typical mounted camera.  Set it to match
                             # YOUR camera: for a high mount looking down, the
                             # far field is a narrow band near the top; for a
                             # low mount it can be half the frame.  Getting this
                             # wrong costs time, not correctness — the pass is
                             # skipped when it would not be finer than the base.
  far_field_target_px: 960   # Longest side of the ROI for the refinement pass.
                             # Capped at the ROI's native size: asking for more
                             # pixels than the source has just interpolates.
  far_field_blend_px:  48    # Source-px feather between the two passes.
                             # Divergence and curl are spatial derivatives, so a
                             # hard seam differentiates into a line of fake
                             # divergence — on the metric that drives crush
                             # alerts.  Do not set this to 0.
                             #
                             # Measured on uniform translation, where the true
                             # divergence is zero everywhere, as mean |div| in
                             # the seam band over mean |div| elsewhere:
                             #
                             #    0 px  1.39x     48 px  1.07x
                             #   24 px  1.20x     96 px  1.03x
                             #
                             # It flattens after 96 (160 px also gives 1.03x).
                             # 48 is the knee: the residual is already far below
                             # anything a threshold reacts to, and a wider
                             # feather fades the refinement over more of the ROI
                             # for no further benefit.

  temporal_smooth_alpha: 0.4 # EMA α for temporal smoothing (higher = faster
                             # response, more noise).  0.4 at 30fps ≈ 2.5-frame
                             # effective window.

  # ── Global motion compensation ──────────────────────────────────────────────
  global_motion_compensation: true
                             # Subtract estimated camera-sway translation from
                             # the flow field.  Essential for pole-mounted CCTV.
  gmc_warn_threshold_px: 3.0 # Correction > this for > 5 s → WARNING log.
                             # A large persistent correction = mount needs work.
  gmc_max_correction_px: 8.0 # Source px/frame.  A correction larger than this
                             # is rejected outright rather than applied: it is
                             # not plausible camera sway, it is the estimator
                             # locking onto moving objects (traffic, a dense
                             # crowd) and reporting their motion as the
                             # camera's.  Applying such an estimate injects a
                             # uniform velocity into the static background and
                             # destroys the field.  Rejected frames are logged
                             # with gmc_method = "rejected".
  gmc_min_improvement: 0.9   # A correction is applied only if it reduces the
                             # field's MEDIAN magnitude to at most this
                             # fraction of its previous value.  Compensation
                             # exists to quiet the background; one that leaves
                             # the field noisier is wrong however confident the
                             # feature matcher was.  This is the guard that
                             # catches a static camera: ORB will happily return
                             # a sub-pixel shift with a 0.96 inlier ratio —
                             # small, self-consistent, and pure noise, because
                             # keypoints at the downsampled compute resolution
                             # are not accurate to a quarter pixel.  Subtracting
                             # it makes every pixel in a still scene appear to
                             # move in the same direction.

  # ── Detector integration ────────────────────────────────────────────────────
  # Set these to your trained RTDetrV2ForObjectDetection folder paths.
  # Searched by models/_weights.py; absolute paths also accepted.
  # Leave empty ("") to disable that detector (a WARNING is logged).
  vehicle_model_path:  ""   # e.g. "model_weights/crowd_vehicles"
  umbrella_model_path: ""   # e.g. "model_weights/crowd_umbrella"

  detector_stride:      5   # Run detectors every Nth flow frame.
                            # Higher = faster but larger mask lag.
  detector_conf_threshold: 0.35

  # ── Metrics ─────────────────────────────────────────────────────────────────
  grid_cell_px:   16        # Grid cell size at source resolution.  Smaller
                            # cells → finer spatial resolution but noisier per-
                            # cell estimates.  16 px is a good starting point.
                            # Divergence and curl are reported PER CELL (the
                            # velocity difference accumulated across one cell
                            # width), so changing this rescales those metrics
                            # and their thresholds proportionally.
  min_magnitude:  0.8       # Source px/frame below which a cell is treated as
                            # static and excluded from zone aggregates.  This
                            # is in SOURCE pixels, so it must clear the noise
                            # floor after the compute-resolution field has been
                            # scaled up (a factor of 4 at 320-px compute on a
                            # 1280-px source).  Too low and every cell counts
                            # as active, which makes the zone means meaningless.
  stop_go_lag_frames: [5, 10, 15]  # Temporal lags for stop-go autocorrelation.

  # ── Visualisation ───────────────────────────────────────────────────────────
  # Both translucent overlays use a PER-PIXEL alpha: the values below are the
  # opacity at full scale, and regions with no motion / no divergence are left
  # untouched.  A uniform alpha tints the whole frame — including everything
  # that is perfectly still — and the result is a washed-out image in which
  # the moving subjects are no easier to see than in the raw video.
  flow_overlay_alpha:  0.85 # HSV flow overlay opacity at the reference speed.
  flow_min_alpha:      0.5  # Opacity for motion that only just clears the
                            # display floor.  The ramp runs between this and
                            # flow_overlay_alpha rather than from zero.
                            #
                            # Colour now encodes DIRECTION only — saturation and
                            # value are held at full.  Magnitude used to be
                            # encoded in the HSV value as well as the alpha,
                            # which faded slow and distant traffic twice over
                            # (dim colour, then transparent) and left the far
                            # carriageway looking static.  Opacity carries
                            # speed; hue carries direction; neither doubles up.
  heatmap_alpha:       0.55 # Divergence heatmap opacity at ±div_scale
  arrow_step_px:       32   # Sparse arrow grid step in pixels.  At 20 px an HD
                            # frame carries ~2300 arrows, which reads as texture
                            # rather than as direction.
  auto_scale_overlay:  true # Scale the flow overlay to each frame's own 95th-
                            # percentile magnitude instead of to a fixed
                            # constant.  Pedestrian flow at 30 fps runs about
                            # 1-3 px/frame; vehicle traffic runs 10-30.  No one
                            # constant serves both, and against a too-large
                            # reference a crowd renders at a few percent
                            # opacity — technically present, visually absent.
                            # Set false to compare absolute speeds across runs.
  max_magnitude_px:    20.0 # Reference magnitude for HSV value/opacity scaling.
                            # A fixed reference when auto_scale_overlay is off;
                            # a floor (÷8) on the automatic one when it is on.
  min_draw_magnitude_px: 0.4 # Absolute source px/frame floor for drawing.
  background_floor_factor: 3.0
                            # The display floor is also required to be this
                            # multiple of the frame's MEDIAN magnitude — a
                            # robust estimate of "what not moving looks like"
                            # on this frame, since most of a fixed camera's
                            # view is background.  A fixed absolute threshold
                            # cannot serve every source: dense-flow noise
                            # scales with bitrate, texture and lighting, so a
                            # value tuned on clean footage covers noisy
                            # footage in arrows.  Display only — metrics and
                            # alerts are unaffected.  Raise it for a cleaner
                            # overlay, lower it to see slower movement.
  div_scale:           2.0  # ±div_scale mapped to full red/blue in heatmap.
                            # Same per-cell units as divergence_critical below.

  # ── Output ──────────────────────────────────────────────────────────────────
  output_csv:              true   # Write per-frame metrics to CSV on finalize()
  output_parquet:          false  # Parquet output (requires pyarrow)
  output_annotated_video:  true   # Write annotated video (via run_flow_analysis.py)
  output_timeseries_plots: true   # Write per-zone PNG plots on finalize()

  # ── Robustness thresholds ───────────────────────────────────────────────────
  # See flow_field.py docstring for a precise description of each heuristic.
  rain_mag_threshold:          8.0   # px/frame mean magnitude above which to suspect rain
  lowlight_gradient_threshold: 12.0  # mean gradient below which to flag low light
  brightness_jump_threshold:   15.0  # Shift in the frame's MEAN GREY LEVEL above
                                     # which the flow update is suppressed (a
                                     # floodlight switching, a cloud crossing).
                                     # Not the mean absolute frame difference:
                                     # that grows with scene motion, so on a busy
                                     # or low-frame-rate camera it suppresses a
                                     # large fraction of good frames and freezes
                                     # the field at its last value.
  min_flow_reliability:        0.35  # Fraction of the inter-frame difference the
                                     # computed flow must explain (measured by
                                     # warping the previous frame with the flow).
                                     # Below this the two frames are almost
                                     # certainly not temporally adjacent — a
                                     # scene cut, a time-lapsed export, or a
                                     # compilation reel — and optical flow is
                                     # undefined on them.  Such frames are
                                     # FLAGGED (discontinuity_flag in the CSV,
                                     # SCENE-CUT? in the video banner), not
                                     # suppressed: a source that is discontinuous
                                     # throughout would otherwise freeze the
                                     # field and hide the problem entirely.

  # ── Cameras ─────────────────────────────────────────────────────────────────
  #
  # Zone polygons may be given in absolute pixels OR as fractions of the frame
  # (every value between 0 and 1).  Fractional polygons are scaled to the real
  # frame size at run time and are the safer choice: a pixel polygon authored
  # against one resolution covers the wrong part of the scene on any other,
  # producing plausible-looking numbers for the wrong region.  A pixel polygon
  # that does not fit the frame is logged as a WARNING at the first frame.
  cameras:

    # Resolution-independent default, used by the web UI and by any source
    # whose geometry has not been surveyed.  Covers the whole frame as a
    # single zone so the module produces usable output on arbitrary footage
    # without per-camera calibration.
    default:
      # Where this camera's far field sits in the frame.  Overrides the global
      # far_field_roi; omit it and the global value applies.
      #
      # This band was measured, not guessed.  Profiling mean flow magnitude by
      # image row on "Nashik Crowd.mp4" shows the top third is sky and rooftops
      # (near-zero motion), the crowd recedes into the distance across the
      # middle, and the near crowd and vehicles fill the bottom.  So the
      # distant *people* — the ones too small for the base pass to resolve —
      # are in the middle band, not at the top of the frame.
      #
      # Measured effect on far-field pixels clearing the display floor:
      #   refinement off ................. 3.1%
      #   generic ROI (top 45%) .......... 3.1%   (refines the sky)
      #   this ROI ....................... 8.3%
      #
      # To find it for a new camera: profile mean flow magnitude by row, or
      # simply look at the frame and mark where people stop being individually
      # distinguishable.
      far_field_roi: [0.0, 0.30, 1.0, 0.75]
      zones:
        - name: "full_frame"
          polygon: [[0.0, 0.0], [1.0, 0.0], [1.0, 1.0], [0.0, 1.0]]
          thresholds:
            # speed_low_ms omitted: meaningless without a homography, and
            # disabled anyway for uncalibrated cameras.
            divergence_critical:  -1.5
            counterflow_critical: 0.25
            turbulence_critical:  0.60
            min_duration_sec:     2.0
            hysteresis_frac:      0.20

    ram_kund_approach:
      # calibrated: false until you run scripts/calibrate_ground_plane.py
      # homography:
      #   image_points:
      #     - [x1, y1]    # pixel coordinates (click in GIMP / cv2 window)
      #     - [x2, y2]
      #     - [x3, y3]
      #     - [x4, y4]
      #   world_points_m:
      #     - [X1, Y1]    # ground-plane metres (measure on-site)
      #     - [X2, Y2]
      #     - [X3, Y3]
      #     - [X4, Y4]
      zones:
        - name: "ghat_approach"
          # Replace with actual polygon from your camera view.
          # These are illustrative placeholder values (640×480 frame assumed).
          polygon: [[0, 240], [640, 240], [640, 480], [0, 480]]
          thresholds:
            speed_low_ms:         0.4    # m/s; DISABLED if uncalibrated
            divergence_critical:  -1.5   # negative = compression → risk
            counterflow_critical: 0.20   # fraction of cells opposing dominant dir
            turbulence_critical:  0.50   # Helbing turbulence index
            min_duration_sec:     2.0    # alert must persist this long
            hysteresis_frac:      0.20   # prevents single-frame oscillation

        - name: "water_steps"
          polygon: [[160, 360], [480, 360], [480, 480], [160, 480]]
          thresholds:
            speed_low_ms:         0.2    # lower threshold near the water's edge
            divergence_critical:  -2.0   # tighter for the highest-risk zone
            counterflow_critical: 0.15
            turbulence_critical:  0.40
            min_duration_sec:     1.5
            hysteresis_frac:      0.20

    kushavarta_kund_approach:
      # homography: (add after calibration)
      zones:
        - name: "kund_approach"
          polygon: [[0, 0], [1920, 0], [1920, 1080], [0, 1080]]
          thresholds:
            speed_low_ms:         0.35
            divergence_critical:  -1.8
            counterflow_critical: 0.18
            turbulence_critical:  0.48
            min_duration_sec:     2.0
            hysteresis_frac:      0.20

    ram_kund_bridge:
      zones:
        - name: "bridge_deck"
          # Bridge: narrower zone, tighter divergence threshold
          polygon: [[300, 0], [980, 0], [980, 1080], [300, 1080]]
          thresholds:
            speed_low_ms:         0.3
            divergence_critical:  -1.2   # bridges compress faster than open ghats
            counterflow_critical: 0.15   # entry/exit separation is mandatory here
            turbulence_critical:  0.45
            min_duration_sec:     2.0
            hysteresis_frac:      0.20
        - name: "bridge_ramp_entry"
          polygon: [[0, 0], [300, 0], [300, 1080], [0, 1080]]
          thresholds:
            divergence_critical: -1.0
            counterflow_critical: 0.12
            turbulence_critical:  0.40
            min_duration_sec:     1.5
            hysteresis_frac:      0.20

    procession_route_north:
      zones:
        - name: "procession_corridor"
          polygon: [[0, 200], [1920, 200], [1920, 880], [0, 880]]
          thresholds:
            speed_low_ms:         0.5    # procession route: higher expected speed
            divergence_critical:  -2.0
            counterflow_critical: 0.25   # processions push against incoming devotees
            turbulence_critical:  0.55
            min_duration_sec:     3.0
            hysteresis_frac:      0.25
